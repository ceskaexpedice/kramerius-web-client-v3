services:
  cdk-client:
    image: trinera/cdk-client:3.0.19-beta
    ports:
      - "1234:80"
    environment:
       - APP_DEV_MODE=${APP_DEV_MODE:-true}
       # Load config (config-main/licenses/homepage) from the client API's
       # /ui-config/* endpoints. Setting this base URL is what enables API
       # config; a mounted local-config file still overrides what comes from
       # the API. Leave empty (default) to use local-config only, as before.
       # Base URL incl. version, e.g. https://.../search/api/client/v7.0
       - APP_API_CONFIG_BASE_URL=${APP_API_CONFIG_BASE_URL:-}
       # Force API-only config: skip local-config entirely, even if mounted.
       # For deployments that ship no local-config JSON. Requires the base URL.
       - APP_FORCE_API_CONFIG=${APP_FORCE_API_CONFIG:-false}
    volumes:
      # Optional: override the bundled default local configuration.
      - ./public/local-config:/usr/share/nginx/local-config:ro
    healthcheck:
       test: ["CMD", "wget", "--quiet", "-O", "/dev/stdout", "http://127.0.0.1:80/local-config/libraries.json"]
       start_period: 30s
       interval: 30s
       timeout: 5s
       retries: 3
