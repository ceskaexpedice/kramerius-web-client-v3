server {
    listen       80;
    server_name  localhost _;

    # ---------------------------------------------------------------------
    # Cache strategy
    #
    # Angular emits content-hashed bundles (main-VG5VPVSJ.js, styles-*.css,
    # media/icon-font-*.woff2). A new build produces new filenames, so those
    # can be cached indefinitely.
    #
    # index.html must NOT be cached: it is the only file that points at the
    # current hashed bundles. Without an explicit Cache-Control, browsers apply
    # heuristic caching (roughly 10% of the file's age) and keep serving a stale
    # index.html that references bundles from the previous release — users then
    # run the old version until they clear their cache manually.
    #
    # The same applies to runtime JSON that is copied verbatim (no hash):
    # assets/env.json, assets/build-info.json, i18n/*.json and local-config/*.
    #
    # "no-cache" does not mean "never store" — it means "always revalidate".
    # Unchanged files come back as a 304, so the cost is a few bytes per load.
    # ---------------------------------------------------------------------

    # Runtime config served from a separate root. Declared before the generic
    # JSON regex below so the alias is preserved (a regex location would
    # otherwise win and resolve these against the wrong root).
    location /local-config/ {
        alias /usr/share/nginx/local-config/;
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Content-hashed build output: immutable, cache for a year.
    # Matches the "-" + 8 uppercase-alphanumeric hash the esbuild builder emits.
    location ~* "-[0-9A-Z]{8}\.(?:js|css|woff2?|ttf|eot|svg)$" {
        root /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Unhashed runtime JSON (env.json, build-info.json, i18n bundles):
    # must be revalidated so config and translation changes land immediately.
    location ~* "^/(?:assets|i18n)/.*\.json$" {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # The SPA entry point: never serve a stale copy.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
