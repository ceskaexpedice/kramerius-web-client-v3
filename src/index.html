<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CDK</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/img/favicon/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!--
    Pre-bootstrap splash. Angular's APP_INITIALIZER waits on env.json +
    config-main.json before anything renders, which left the window blank for
    up to ~1-2 s on reload. These styles are inline (no extra request) and the
    markup inside <app-root> is replaced by Angular the moment it boots.
    Theme is resolved from the same 'app-settings' key SettingsService writes,
    so the splash does not flash the wrong background in dark mode.
  -->
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #EFF2F5;
    }
    html.dark #app-splash { background: #263340; }
    #app-splash .app-splash__spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(38, 51, 64, .18);
      border-top-color: #263340;
      border-radius: 50%;
      animation: app-splash-spin .8s linear infinite;
    }
    html.dark #app-splash .app-splash__spinner {
      border-color: rgba(239, 242, 245, .22);
      border-top-color: #EFF2F5;
    }
    @keyframes app-splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #app-splash .app-splash__spinner { animation-duration: 2.4s; }
    }
  </style>
  <script>
    // Resolve the persisted theme before first paint so the splash (and the
    // app behind it) start on the correct background instead of flashing light.
    // Mirrors SettingsService.applyTheme(); SettingsService re-applies the
    // class itself once it boots, so this is only about the pre-boot frame.
    (function () {
      try {
        var raw = localStorage.getItem('app-settings');
        var theme = raw ? (JSON.parse(raw) || {}).theme : null;
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(theme);
      } catch (e) {
        document.documentElement.classList.add('light');
      }
    })();
  </script>
</head>
<body>
  <app-root>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Načítám…">
      <div class="app-splash__spinner"></div>
    </div>
  </app-root>

  <!--
    Color-vision (daltonization) filters for the accessibility settings.
    These feColorMatrix values are the standard color-blindness simulation/
    correction matrices (Brettel/Machado). Modes reference them via
    `filter: url(#tritanopia)` in public/styles/accessibility/*.scss.
    Kept inline + visually hidden so they are always reachable, independent of
    routing or SSR hydration.
  -->
  <svg xmlns="http://www.w3.org/2000/svg"
       aria-hidden="true" focusable="false"
       style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none">
    <defs>
      <filter id="protanopia" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="
          0.567 0.433 0     0 0
          0.558 0.442 0     0 0
          0     0.242 0.758 0 0
          0     0     0     1 0" />
      </filter>
      <filter id="deuteranopia" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="
          0.625 0.375 0     0 0
          0.7   0.3   0     0 0
          0     0.3   0.7   0 0
          0     0     0     1 0" />
      </filter>
      <filter id="tritanopia" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="
          0.95  0.05  0      0 0
          0     0.433 0.567  0 0
          0     0.475 0.525  0 0
          0     0     0      1 0" />
      </filter>
    </defs>
  </svg>
</body>
</html>
