<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CDK</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/img/favicon/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <script>
    (function() {
      var hostname = window.location.hostname;
      var gId;

      if (hostname.endsWith('cdk.test.trinera.cloud')) {
        gId = 'G-W742T420R3';
      } else if (hostname.endsWith('cdk.app.trinera.cloud')) {
        gId = 'G-674F59YZR2';
      } else {
        return;
      }

      var script = document.createElement('script');
      script.src = 'https://www.googletagmanager.com/gtag/js?id=' + gId;
      script.async = true;
      document.head.appendChild(script);

      script.onload = function() {
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          window.dataLayer.push(arguments);
        }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', gId);
      };
    })();
  </script>

</head>
<body>
  <app-root></app-root>

  <!--
    Color-vision (daltonization) filters for the accessibility settings.
    These feColorMatrix values are the standard color-blindness simulation/
    correction matrices (Brettel/Machado). Modes reference them via
    `filter: url(#tritanopia)` in public/styles/accessibility/*.scss.
    Kept inline + visually hidden so they are always reachable, independent of
    routing or SSR hydration.
  -->
  <svg xmlns="http://www.w3.org/2000/svg"
       aria-hidden="true" focusable="false"
       style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none">
    <defs>
      <filter id="protanopia" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="
          0.567 0.433 0     0 0
          0.558 0.442 0     0 0
          0     0.242 0.758 0 0
          0     0     0     1 0" />
      </filter>
      <filter id="deuteranopia" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="
          0.625 0.375 0     0 0
          0.7   0.3   0     0 0
          0     0.3   0.7   0 0
          0     0     0     1 0" />
      </filter>
      <filter id="tritanopia" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="
          0.95  0.05  0      0 0
          0     0.433 0.567  0 0
          0     0.475 0.525  0 0
          0     0     0      1 0" />
      </filter>
    </defs>
  </svg>
</body>
</html>
