<label *ngIf="showLabel">
  {{ label | translate}}
</label>

<div class="toggle-group" [ngClass]="[size, 'variant-' + variant]" role="group"
     [attr.aria-label]="groupAriaLabel ? (groupAriaLabel | translate) : null">
  <button
    *ngFor="let option of options"
    type="button"
    class="toggle-btn"
    [attr.aria-label]="option.ariaLabel ? (option.ariaLabel | translate) : null"
    [attr.aria-pressed]="option.value === value"
    [appCdkTooltip]="option.ariaLabel ? (option.ariaLabel | translate) : ''"
    [tooltipDisabled]="!option.ariaLabel"
    tooltipPosition="bottom"
    [class.active]="option.value === value"
    (click)="select(option)"
  >
    <i *ngIf="option.icon" [ngClass]="option.icon" [style.color]="'var(' + option.iconColor + ')'" aria-hidden="true"></i>

    <ng-container *ngIf="option.label">
      {{ option.label | translate }}
    </ng-container>
  </button>
</div>
