<div class="paginator" [class.compact]="layout === 'compact'" *ngIf="pages().length > 0 && totalCount > pageSize">
  <div class="pages">
    <ng-container *ngIf="!showOnlyArrows">

      <ng-container *ngFor="let p of pages()">
        <button *ngIf="p > 0" type="button" [class.active]="p === page" [attr.aria-current]="p === page ? 'page' : null" (click)="goToPage(p)"
          [attr.aria-label]="('go-to-page' | translate).replace('{{p}}', p)" [disabled]="disabledPagination">
          {{ p }}
        </button>

        <!-- Left Ellipsis (Jump Backward) -->
        <button *ngIf="p === -1" class="ellipsis-button" (click)="jump(-5)"
          [attr.aria-label]="'paginator-jump-backward' | translate" [title]="'paginator-jump-backward' | translate">
          ...
        </button>

        <!-- Right Ellipsis (Jump Forward) -->
        <button *ngIf="p === -2" class="ellipsis-button" (click)="jump(5)"
          [attr.aria-label]="'paginator-jump-forward' | translate" [title]="'paginator-jump-forward' | translate">
          ...
        </button>

        <!-- Static Ellipsis (Compact Mode) -->
        <span *ngIf="p === -3" class="ellipsis-text">...</span>
      </ng-container>

    </ng-container>

    @if (showArrows) {
      <button class="button tertiary outlined arrow-button prev-button"
              [attr.aria-label]="'go-to-previous-page' | translate" (click)="goToPage(page - 1)"
              [disabled]="page === 1 || disabledPagination">
        <i class="icon-arrow-left-3" aria-hidden="true"></i>
      </button>

      <button class="button tertiary outlined arrow-button next-button" [attr.aria-label]="'go-to-next-page' | translate"
              (click)="goToPage(page + 1)" [disabled]="page === lastPage() || disabledPagination">
        <i class="icon-arrow-right-3" aria-hidden="true"></i>
      </button>
    }
  </div>

  <!-- Hidden on phones: rarely used there, and the page size is also in Settings. -->
  <div class="page-size" *ngIf="showPageSizeOptions && !breakpointService.isMobile()">
    {{'paginator-page-size' | translate}}:

    <app-select [disabled]="disabledPageSize" [options]="pageSizeOptions" [value]="pageSize"
      [ariaLabel]="'page-size--label' | translate"
      (valueChange)="changePageSize($event)">
    </app-select>
    <!--    -->
    <!--    <select [value]="pageSize" (change)="changePageSize($event)">-->
    <!--      <option *ngFor="let opt of pageSizeOptions" [value]="opt">{{ opt }}</option>-->
    <!--    </select>-->
  </div>
</div>
