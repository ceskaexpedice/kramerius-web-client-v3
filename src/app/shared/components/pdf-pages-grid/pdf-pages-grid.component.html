<div class="pdf-pages-grid">
  <div *ngIf="pages.length === 0" class="pdf-pages-grid__empty">
    {{ 'loading-pages' | translate }}
  </div>

  <div *ngIf="pages.length > 0" class="pdf-pages-grid__container"
    role="list" [attr.aria-label]="'pdf-pages-grid--arialabel' | translate">
    <button *ngFor="let page of pages" type="button" class="pdf-pages-grid__item"
      role="listitem"
      [class.pdf-pages-grid__item--active]="page.pageNumber === currentPage" (click)="navigateToPage(page.pageNumber)"
      [attr.aria-current]="page.pageNumber === currentPage ? 'page' : null"
      [attr.aria-label]="('go-to-page--arialabel' | translate:{ number: page.pageNumber })">
      <div class="pdf-pages-grid__thumbnail">
        <app-thumbnail-image
          [src]="getThumbnailUrl(page.pageNumber)"
          alt=""
          fallbackIcon="document">
        </app-thumbnail-image>
      </div>
      <div class="pdf-pages-grid__number" aria-hidden="true">
        {{ page.pageNumber }}
      </div>
    </button>
  </div>
</div>
