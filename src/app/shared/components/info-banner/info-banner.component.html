<div class="info-banner" [class.info-banner--primary]="variant === 'primary'"
  [class.info-banner--light]="variant === 'light'"
  [class.info-banner--success]="variant === 'success'" role="status">

  <div class="info-banner__icon">
    <i [class]="icon"></i>
  </div>

  <div class="info-banner__text">
    <p class="info-banner__title">{{ title }}</p>
    @if (dontShowId) {
      <label class="info-banner__dont-show">
        <input type="checkbox" [checked]="dontShowChecked" (change)="onDontShowToggle($event)" />
        <span class="info-banner__message">{{ message }}</span>
      </label>
    } @else {
      <p class="info-banner__message">{{ message }}</p>
    }
  </div>

  <div class="info-banner__actions">
    @for (action of actions; track action.id) {
      <button [class]="(action.style || '') + ' with-icon sm'" type="button"
        (click)="onAction(action.id)">
        @if (action.icon) { <i [class]="action.icon"></i> }
        {{ action.label }}
      </button>
    }
  </div>
</div>
