<div class="detail-layout">
<!--  <header class="detail-layout&#45;&#45;top-toolbar">-->
<!--    <ng-content select="[top-toolbar]"></ng-content>-->
<!--  </header>-->

  <div class="detail-layout--body">

    <app-filter-sidebar
      [padding]="'0'"
      [scrollable]="false"
      [toggleButtonPosition]="'left'"
      [toggleButtonIcon]="'icon-sidebar-left'"
      [openLabelKey]="'pages-panel--show'"
      [closeLabelKey]="'pages-panel--hide'"
      [hideToggleButton]="hideFilterToggle"
      [mobileTitleKey]="leftSidebarMobileTitleKey"
      [hideMobileTitle]="hideLeftSidebarMobileTitle">

      <ng-content select="[left-sidebar]"></ng-content>

    </app-filter-sidebar>

    <section class="detail-layout--main" [attr.aria-label]="'document-content--arialabel' | translate">

      <!-- Phones: the toolbar leaves with the app header and the nav bar, in
           immersive reading (collapses; a tap on the viewer brings it back) and
           while a list scrolls down (music track list: the list runs under it,
           so it only slides away, see ScrollHideHeaderDirective). -->
      <div class="detail-layout--action-toolbar"
           [class.detail-layout--action-toolbar--hidden]="uiStateService.immersive()"
           [attr.inert]="toolbarHidden() ? '' : null">
        <div class="detail-layout--action-toolbar-inner">
          <ng-content select="[action-toolbar]"></ng-content>
        </div>
      </div>

      <div class="detail-layout--main-content"
           [class.detail-layout--main-content--with-right-sidebar]="showRightSidebar"
           [class.detail-layout--main-content--overlay-right]="rightOverlay()"
           [style.--sidebar-right-width]="showRightSidebar && !rightSidebarCollapsed && !rightOverlay() ? 'calc(var(--metadata-sidebar-width) + 1px)' : '0px'">

        <div class="detail-layout--license-bar-slot">
          <ng-content select="[license-bar]"></ng-content>
        </div>

        <ng-content select="[main-content]"></ng-content>

        @if (showRightSidebar) {
          <!-- Collapsed: [inert] removes the off-screen panel from tab order and the
               a11y tree. Below 1280px the panel overlays the viewer instead of
               squeezing it (rightOverlay), and Escape closes it. -->
          <aside class="detail-layout--sidebar-right"
                 [id]="rightSidebarId"
                 [class.collapsed]="rightSidebarCollapsed"
                 [class.overlay]="rightOverlay()"
                 [attr.inert]="rightSidebarCollapsed ? '' : null"
                 [attr.aria-label]="'metadata-panel--label' | translate"
                 (keydown.escape)="onRightSidebarEscape($event)">
            @if (!rightSidebarCollapsed && !rightOverlay()) {
              <app-panel-resize-handle [controls]="rightSidebarId"></app-panel-resize-handle>
            }
            <ng-content select="[right-sidebar]"></ng-content>
          </aside>
        }

      </div>

      @if (showBottomToolbar) {
        <footer class="detail-layout--bottom-toolbar" [class.constrained]="constrainBottomToolbar">
          <ng-content select="[bottom-toolbar]"></ng-content>
        </footer>
      }

    </section>

  </div>



</div>
