<div class="track-item-wrapper">
  <div
    class="track"
    [class.current-track]="isCurrentTrack"
  >
    <div class="thumb-wrapper" (click)="isCurrentTrack ? togglePlayPause() : play()"
         role="button" tabindex="0" [attr.aria-label]="track['title.search']"
         (keydown.enter)="isCurrentTrack ? togglePlayPause() : play()"
         (keydown.space)="$event.preventDefault(); isCurrentTrack ? togglePlayPause() : play()">
      <app-thumbnail-image
        class="thumb"
        [src]="soundService.getImageThumbnailUrl(track.parentPid)"
        fallbackIcon="music"
        size="auto">
      </app-thumbnail-image>
      <div class="thumb-overlay">
        <i *ngIf="isCurrentTrack"
           [class.icon-play]="!soundService.isPlayingSignal()"
           [class.icon-pause]="soundService.isPlayingSignal()" aria-hidden="true"></i>
        <i *ngIf="!isCurrentTrack" class="icon-play" aria-hidden="true"></i>
      </div>
    </div>

    <div class="info" (click)="play()"
         role="button" tabindex="0" [attr.aria-label]="track['title.search']"
         (keydown.enter)="play()" (keydown.space)="$event.preventDefault(); play()">
      <div class="title">{{ track['title.search'] }}</div>
    </div>

    <div class="actions">
      <button class="icon-button rounded light" (click)="remove($event)"
              [attr.aria-label]="'delete' | translate">
        <i class="icon-trash" aria-hidden="true"></i>
      </button>
      <button class="icon-button rounded light"
              [class.favorited]="isItemFavorited$ | async"
              [attr.aria-label]="((isItemFavorited$ | async) ? 'remove-from-favorites' : 'add-to-favorites') | translate"
              (click)="toggleFavorite($event)">
        <i [ngClass]="(isItemFavorited$ | async) ? 'icon-heart-filled' : 'icon-heart'" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <!-- Favorites Popup positioned outside to avoid overflow clipping -->
  <div class="favorites-popup-wrapper"
       *ngIf="favoritesPopupState.showPopup()"
       [class.positioned]="favoritesPopupState.popupPositioned()">
    <app-favorites-popup
      [itemId]="currentTrackId()"
      [itemName]="currentTrackName()"
      (close)="favoritesPopupState.closePopup()">
    </app-favorites-popup>
  </div>
</div>
