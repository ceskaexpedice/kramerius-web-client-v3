<div class="checkbox" [class.checked]="checked()" (click)="toggle()"
     role="checkbox" tabindex="0" [attr.aria-checked]="checked()"
     (keydown.enter)="toggle()" (keydown.space)="$event.preventDefault(); toggle()">
  <svg *ngIf="checked()" width="16" height="16" viewBox="0 0 24 24">
    <path fill="white" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z" />
  </svg>
</div>
