<div class="lang-switcher-pos" [class.expanded]="expanded" appClickOutside (clickOutside)="close()">
  @if (!label) {
    <button #trigger type="button" class="selected" (click)="toggle()"
            [attr.aria-label]="'select-language--arialabel' | translate" aria-haspopup="listbox" [attr.aria-expanded]="expanded">
      @if (selected) {
        <div class="icon-lang">
          <app-language-badge [lang]="selected.name" [src]="selected.icon" [rounded]="true"></app-language-badge>
        </div>
      }
      <div class="arrow">
        <i class="fa fa-angle-down arrow-icon" [class.arrow-icon--rotated]="expanded" aria-hidden="true"></i>
      </div>
    </button>
  } @else {
    <button #trigger class="label-trigger" (click)="toggle()">
      <i class="icon-add" aria-hidden="true"></i>
      <span>{{ label }}</span>
    </button>
  }

  @if (expanded) {
    <div class="available-languages"
         [class.available-languages--absolute]="!dropdownFixed"
         [style.top.px]="dropdownFixed ? dropdownTop : null"
         [style.right.px]="dropdownFixed ? dropdownRight : null">
      <div class="languages-list" role="listbox" [attr.aria-label]="'select-language--arialabel' | translate">
        @for (lang of languages; track lang.code) {
          <button type="button" class="lang-item" (click)="pick(lang.code)"
                  role="option" [attr.aria-selected]="lang.code === selectedCode"
                  [class.lang-item--selected]="lang.code === selectedCode">
            <div class="lang-item__left">
              <div class="lang-item__icon">
                <app-language-badge [lang]="lang.name" [src]="lang.icon" [rounded]="true"></app-language-badge>
              </div>
              <span class="lang-item__name">{{ lang.name }}</span>
            </div>
          </button>
        }
      </div>
    </div>
  }
</div>
