<div class="generic-dialog-container">
  <h2>
    {{ dialogTitle | translate }}
    <button class="button link tertiary icon-button close-button" (click)="onClose()">
      <i class="icon-close"></i>
    </button>
  </h2>

  <div class="dialog-body">
    <div class="content">

      <div class="select-all-container">

        <mat-slide-toggle [checked]="allSelected()" [hideIcon]="true" [class]="'size-sm'" (change)="toggleSelectAll()">
          {{ 'select-all-pages' | translate }} ({{ pages.length }})
        </mat-slide-toggle>

        <div class="page-range-input-container">

          <span>{{'type-in-index' | translate}}</span>

          <app-input
            [type]="'text'"
            [placeholder]="'page-range-placeholder'"
            [signalInput]="pageRangeInput"
            [showClearButton]="true"
            [theme]="'dark'"
            (valueChange)="onPageRangeInput($event)"
            (onBlurEvent)="onPageRangeBlur()"
            [size]="'sm'"
          ></app-input>
        </div>

        @if (breakpointService.isDesktop()) {
          <span class="selected-info">
          <i class="icon-bulb"></i>
            {{ 'press-shift-for-multiselect' | translate }}
        </span>
        }

      </div>

      <!--
        Virtualized page grid. This dialog lists *every* page of the document,
        each one a thumbnail-bearing card, so a large scan meant 1000+ <img>
        elements in a single dialog. Rows are the virtual unit (cdkVirtualFor
        virtualizes a flat list, but this is a multi-column grid), and both the
        column count and the row height are measured from the live DOM because
        the grid uses `auto-fill` with responsive breakpoints.
      -->
      <cdk-virtual-scroll-viewport
        class="page-selection-grid__viewport"
        [itemSize]="rowHeight()"
        [minBufferPx]="rowHeight() * 2"
        [maxBufferPx]="rowHeight() * 4">

        <div class="page-selection-grid" #gridMeasure>
          <div class="page-selection-grid__row" [style.height.px]="rowHeight()"
               *cdkVirtualFor="let row of pageRows(); trackBy: trackByRow; templateCacheSize: 0">
            @for (page of row; track page.pid) {
              <app-detail-page-item [page]="page" [type]="'page'" [pageNumber]="pageNumber(page)"
                [pageNumberPosition]="'bottom-left'"
                [showPageNumberInSelectionMode]="true" [localSelectionMode]="true"
                [localIsSelected]="isPageSelected(page.pid)"
                [showPreviewButton]="true"
                [class.disabled-selection]="!isPageSelected(page.pid) && isLimitReached()"
                (selectionToggled)="togglePageSelection(page.pid, $event.event)"
                (previewClicked)="onPreviewClicked($event)">
              </app-detail-page-item>
            }
          </div>
        </div>
      </cdk-virtual-scroll-viewport>

    </div>
  </div>

  <!-- Dialog Actions -->
  <div class="dialog-actions">
    <button class="button outlined tertiary" (click)="onClose()">
      {{ 'cancel' | translate }}
    </button>

    <button class="button primary" [disabled]="selectedCount() === 0" (click)="onSubmit()">
      {{ 'download' | translate }} ({{ selectedCount() }})
    </button>
  </div>

</div>
