@if (compact) {
  <app-menu [items]="menuItems" placement="bottom-end" [customTrigger]="true" (select)="onMenuSelect($event)">
    <button menuTrigger type="button" class="icon-button outlined tertiary results-sort__trigger"
      [attr.aria-label]="('sort-by' | translate) + ': ' + (selectedSortOption.label | translate)"
      [appCdkTooltip]="('sort-by' | translate) + ': ' + (selectedSortOption.label | translate)">
      <i class="icon-sort" aria-hidden="true"></i>
    </button>
  </app-menu>
} @else {
<app-select
  [class]="'result-sort-select'"
  [size]="'sm'"
  [ariaLabel]="'sort-by' | translate"
  [options]="sortOptions"
  [value]="selectedSortOption"
  [displayFn]="sortOptionDisplayFn"
  [zIndex]="101"
  (valueChange)="onSortChange($event)">
</app-select>
}
