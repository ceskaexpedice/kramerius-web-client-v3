<!--
  Virtualized page grid.

  A 1000-page document used to render 1000 `app-detail-page-item`s (~10k DOM
  nodes and 1000 `<img>`s). Every zone change-detection tick then swept all of
  them, which made anything animating on top of the sidebar — most visibly the
  former mobile slide-up panel, which called detectChanges() on each touchmove — drop
  frames. The viewport keeps only the visible rows in the DOM.

  Rows, not items, are the virtual unit: the grid is multi-column, and
  cdkVirtualFor virtualizes a flat list. `rows()` chunks the pages by the column
  count and `rowHeight()` is measured from a real cell (the cells are sized by
  aspect-ratio, so the height depends on the container width and cannot be a
  constant).
-->
<cdk-virtual-scroll-viewport
  *ngIf="pages()"
  class="page--grid--viewport"
  [itemSize]="rowHeight()"
  [minBufferPx]="rowHeight() * 2"
  [maxBufferPx]="rowHeight() * 4">

  <div class="page--grid" [ngClass]="'type-' + type" #gridMeasure>
    <div class="page--grid__row" [style.height.px]="rowHeight()"
      *cdkVirtualFor="let row of rows(); trackBy: trackByRow; templateCacheSize: 0">
      @for (page of row; track page.pid) {
        <app-detail-page-item
          [page]="page"
          [type]="type"
          [pageType]="page['page.type']"
          [pageNumber]="page['page.number']"
          [isSelected]="detailViewService.isPageActiveByPid(page.pid)"
          [isLocked]="detailViewService.isPageLocked(page.pid)"
          [isUnlocked]="detailViewService.isPageUnlocked(page.pid)"
          [isAccessible]="detailViewService.isDocumentRestrictedButAccessible()"
          [lockStyle]="detailViewService.pageLockStyle()"
          (pageClicked)="clickedPage(page.pid)"
        >
        </app-detail-page-item>
      }
    </div>
  </div>
</cdk-virtual-scroll-viewport>
