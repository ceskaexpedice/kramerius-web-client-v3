@for (bar of activeBars(); track bar.licenses[0]) {
  <div class="license-bar" [class.clickable]="!!bar.link" (click)="bar.link && $event.currentTarget">
    <div class="license-bar--inner">
      <span class="license-bar--title">
        @if (bar.logo) {
          <img [src]="bar.logo" alt="">
        }
        <span class="license-bar--text">{{ getLocalizedText(bar) }}</span>
      </span>

      @if (userService.userSession) {
        <span class="license-bar--session">
          {{ userService.getFormattedExpiration() }}<span class="license-bar--user"> · {{ userService.userSession.session.eduPersonUniqueId || '' }}</span>
        </span>
      }
    </div>
  </div>
}
