<div class="auth-callback-container">
  <div class="auth-callback-content">
    @if (loading()) {
      <div class="loading">
        <div class="spinner"></div>
        <h2>{{ 'completing-authentication' | translate }}</h2>
        <p>{{ 'authentication-wait' | translate }}</p>
      </div>
    }

    @if (failed()) {
      <div class="error" role="alert">
        <h2>{{ 'authentication-error' | translate }}</h2>
        <p>{{ 'authentication-failed-message' | translate }}</p>
        <button type="button" class="button primary" (click)="goHome()">
          {{ 'error.not_found.return_button' | translate }}
        </button>
      </div>
    }
  </div>
</div>
